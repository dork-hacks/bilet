[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
# The product name is bilet (MASTERPLAN.md). The user-facing name lives in
# src/tool/config.py; "tool" here is only the internal package and command name.
name = "tool"
version = "0.1.0"
description = "Local network security checker for non-technical users (R Systems Hackathon 2026)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The AI layer's cloud provider (LLM_PROVIDER=anthropic). Findings and scores never use it.
    # 1.17.0 (2026-10-20) is the first pin tested to accept output_config (#61).
    "anthropic==1.17.0",
    "defusedxml==0.7.1",
    "fastapi==0.115.6",
    "jinja2==3.1.4",
    "uvicorn==0.32.1",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",  # FastAPI's TestClient
    "pytest==8.3.4",
    "ruff==0.8.2",
]

[project.scripts]
# Two names, one entry point (#101): `bilet` is the product name, `tool` keeps working.
bilet = "tool.cli:main"
tool = "tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tool.web" = ["templates/*.html"]

[tool.pytest.ini_options]
# lab/tests are plain unittest files (they also run on a Pi without pytest); listing them
# here makes CI's `make test` run them too (#108).
testpaths = ["tests", "lab/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
