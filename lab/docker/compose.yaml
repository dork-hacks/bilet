# Setup D (brief): the three lab "devices" as containers on a private Docker /24.
# Same fake services as the Raspberry Pis (lab/fakes/fakesvc.py), for use before
# the Pis arrive, as the fallback if the hotspot isolates clients, and as a test
# network for the live scan (#20).
#
#   docker compose -f lab/docker/compose.yaml up -d
#   docker compose -f lab/docker/compose.yaml run --rm scanner <nmap args>   # see lab/README.md
#   docker compose -f lab/docker/compose.yaml down
#
# Pick which weak services each device runs (the default set matches the Pis):
#   CAMERA_SERVICES="telnet http rtsp" docker compose -f lab/docker/compose.yaml up -d camera

name: lab

x-fake: &fake
  image: python:3.12.7-slim-bookworm
  user: "65534:65534"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  sysctls:
    net.ipv4.ip_unprivileged_port_start: "0"
  mem_limit: 64m
  pids_limit: 32
  restart: unless-stopped
  volumes:
    - ../fakes/fakesvc.py:/lab/fakesvc.py:ro

services:
  camera:
    <<: *fake
    command: python3 -I /lab/fakesvc.py ${CAMERA_SERVICES:-telnet http} --bind 0.0.0.0
    networks:
      lab: {ipv4_address: 10.77.0.11}

  server:
    <<: *fake
    command: python3 -I /lab/fakesvc.py ${SERVER_SERVICES:-ftp} --bind 0.0.0.0
    networks:
      lab: {ipv4_address: 10.77.0.12}

  hub:
    <<: *fake
    command: python3 -I /lab/fakesvc.py ${HUB_SERVICES:-mqtt} --bind 0.0.0.0
    networks:
      lab: {ipv4_address: 10.77.0.13}

  scanner:
    image: instrumentisto/nmap:7.95
    profiles: [scan]
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN, DAC_OVERRIDE]  # DAC_OVERRIDE: write the XML into ./out
    volumes:
      - ${LAB_OUT:-./out}:/out
    networks:
      lab: {ipv4_address: 10.77.0.2}

networks:
  lab:
    ipam:
      config:
        - subnet: 10.77.0.0/24
