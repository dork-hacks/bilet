  <style>
    /* Base text 18px (>= 16px, MASTERPLAN 6.5). All colour pairs below pass WCAG AA. */
    :root { font-size: 18px; color: #1a1a1a; background: #ffffff; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.5;
           margin: 0 auto; max-width: 42rem; padding: 1rem; }
    a { color: #0b4f9c; }
    a:focus-visible, button:focus-visible, select:focus-visible {
      outline: 3px solid #0b4f9c; outline-offset: 2px; }
    .skip { position: absolute; left: -999px; }
    .skip:focus { left: 1rem; top: 1rem; background: #fff; padding: .5rem; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 1rem;
             flex-wrap: wrap; }
    nav ul { list-style: none; display: flex; gap: 1rem; margin: 0; padding: 0; }
    nav [aria-current="true"] { font-weight: 700; text-decoration: none; color: #1a1a1a; }
    .score { border: 4px solid; border-radius: 1rem; padding: 1.25rem; margin: 1.5rem 0;
             display: flex; align-items: center; gap: 1.25rem; }
    .score .icon { font-size: 3rem; font-weight: 700; width: 4.5rem; height: 4.5rem;
                   border-radius: 50%; display: flex; align-items: center;
                   justify-content: center; color: #ffffff; flex-shrink: 0; }
    .score .number { font-size: 3rem; font-weight: 700; line-height: 1; }
    .score .label { font-size: 1.4rem; font-weight: 700; }
    .good { border-color: #1b6e2a; background: #eef7ef; } .good .icon { background: #1b6e2a; }
    .warn { border-color: #8a5a00; background: #fff6e0; } .warn .icon { background: #8a5a00; }
    .bad  { border-color: #b3261e; background: #fdeceb; } .bad .icon  { background: #b3261e; }
    .first { border-left: 6px solid #1a1a1a; padding: .5rem 1rem; background: #f4f4f4; }
    .first p { margin: .5rem 0; font-size: 1.15rem; }
    .muted { color: #4a4a4a; }
    /* Devices and findings (#55). The severity is always written in the tag text. */
    .device { border: 2px solid #c8c8c8; border-radius: .75rem; padding: .75rem 1rem;
              margin: 1rem 0; }
    .device h3 { margin: .25rem 0 .5rem; font-size: 1.2rem; }
    .finding { border-left: 6px solid #4a4a4a; padding: .25rem .75rem; margin: .75rem 0; }
    .finding h4 { margin: .25rem 0; font-size: 1.1rem; }
    .finding p, .finding ol { margin: .4rem 0; }
    .tag { font-weight: 700; padding: 0 .4rem; border-radius: .3rem; color: #ffffff;
           background: #4a4a4a; }
    .sev-high { border-left-color: #b3261e; } .sev-high .tag { background: #b3261e; }
    .sev-medium { border-left-color: #8a5a00; } .sev-medium .tag { background: #8a5a00; }
    .sev-low { border-left-color: #0b4f9c; } .sev-low .tag { background: #0b4f9c; }
    .safe summary { cursor: pointer; font-weight: 700; padding: .5rem 0; }
    .safe summary:focus-visible { outline: 3px solid #0b4f9c; outline-offset: 2px; }
    /* The AI / standard label is text, not only colour (MASTERPLAN 6.5). */
    .source-tag { display: inline-block; font-size: .9rem; border: 1px solid #4a4a4a;
           border-radius: .3rem; padding: 0 .4rem; color: #4a4a4a; white-space: nowrap; }
    .ai { margin-top: 2rem; border-top: 1px solid #c4c4c4; }
    .ai h2 { font-size: 1.2rem; }
    .plan ol { margin: .5rem 0; padding-left: 1.5rem; }
    .ask label { display: block; font-weight: 700; margin: .5rem 0 .25rem; }
    .ask input[type=text] { font-size: 1rem; width: 100%; box-sizing: border-box;
           padding: .5rem; border: 2px solid #4a4a4a; border-radius: .5rem; }
    .ask input[type=text]:focus-visible { outline: 3px solid #0b4f9c; outline-offset: 2px; }
    .ask button { font-size: 1rem; margin-top: .5rem; background: #ffffff; color: #0b4f9c;
           cursor: pointer; }
    .reply { border-left: 6px solid #0b4f9c; padding: .25rem 1rem; background: #f4f4f4; }
    .button { display: inline-block; padding: .5rem 1rem; border: 2px solid #0b4f9c;
              border-radius: .5rem; text-decoration: none; font-weight: 700; }
    /* History screen (#65). The band label is always written next to its colour. */
    table { border-collapse: collapse; width: 100%; margin: .5rem 0 1rem; }
    th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid #c8c8c8; }
    .chip { font-weight: 700; padding: 0 .4rem; border-radius: .3rem; color: #ffffff;
            white-space: nowrap; }
    .chip.good { background: #1b6e2a; } .chip.warn { background: #8a5a00; }
    .chip.bad { background: #b3261e; }
    .chart { width: 100%; height: auto; border: 1px solid #c8c8c8; border-radius: .5rem; }
    .chart text { font-size: 16px; fill: #1a1a1a; }
    .picker label { display: block; font-weight: 700; margin: .5rem 0 .25rem; }
    .picker select, .history button { font-size: 1rem; padding: .4rem; max-width: 100%; }
    .history button { background: #ffffff; color: #0b4f9c; cursor: pointer; margin-top: .5rem; }
    .history button.danger { color: #b3261e; border-color: #b3261e; }
    .notice { border-left: 6px solid #0b4f9c; padding: .25rem 1rem; background: #f4f4f4; }
    .changes h3 { font-size: 1.1rem; margin: 1rem 0 .25rem; }
  </style>
